version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: revenue_optimizer_db
    environment:
      POSTGRES_USER: optimizer
      POSTGRES_PASSWORD: optimizer_password
      POSTGRES_DB: revenue_optimizer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
